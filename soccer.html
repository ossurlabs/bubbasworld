<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">
<title>Bubba's World Cup — soccer mode prototype</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #1a1a1a; --cream: #efe9d9; --amber: #e8a44a; --amber-deep: #b87828;
    --blue: #6ab7e8; --blue-deep: #3a7ab0; --pink: #f0a0a8; --brown: #8a5a3a;
    --grass: #4a8c3a; --grass-deep: #36682b;
  }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: var(--ink); color: var(--cream);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none; touch-action: none; overscroll-behavior: none;
  }
  body { position: fixed; inset: 0; width: 100dvw; height: 100dvh; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; background: var(--ink); box-shadow: 0 0 40px rgba(0,0,0,0.8); overflow: hidden; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; width: 100%; height: 100%; }

  .screen {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 6% 8%; text-align: center; z-index: 10;
  }
  .screen.hidden { display: none; }
  .screen h1 {
    font-family: 'Courier New', monospace; font-weight: 900; font-size: clamp(28px, 8vw, 46px);
    line-height: 1; color: var(--cream); text-shadow: 3px 3px 0 var(--ink); margin-bottom: 0.4em;
  }
  .screen h2 {
    font-family: 'Courier New', monospace; font-weight: 700; font-size: clamp(16px, 4.4vw, 22px);
    color: var(--amber); margin-bottom: 0.3em; text-shadow: 2px 2px 0 var(--ink); letter-spacing: 0.06em;
  }
  .bubble {
    background: var(--cream); color: var(--ink); border: 4px solid var(--ink); padding: 16px 18px;
    font-family: 'Courier New', monospace; font-weight: 700; font-size: clamp(13px, 3.4vw, 16px);
    line-height: 1.45; max-width: 90%; margin: 14px 0; box-shadow: 6px 6px 0 var(--amber);
  }
  .btn {
    display: inline-block; padding: 16px 32px; font-family: 'Courier New', monospace; font-weight: 900;
    font-size: clamp(16px, 4.4vw, 20px); letter-spacing: 0.08em; background: var(--amber); color: var(--ink);
    border: 4px solid var(--ink); box-shadow: 0 6px 0 var(--amber-deep), 0 8px 0 var(--ink);
    cursor: pointer; margin: 8px 0;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--amber-deep), 0 4px 0 var(--ink); }
  .btn.secondary { background: var(--blue); box-shadow: 0 6px 0 var(--blue-deep), 0 8px 0 var(--ink); }

  #hud {
    position: absolute; top: 0; left: 0; right: 0; padding: 12px 14px; display: flex; justify-content: space-between;
    pointer-events: none; z-index: 5; font-family: 'Courier New', monospace; font-weight: 900; text-shadow: 2px 2px 0 var(--ink); gap: 8px;
  }
  #hud .pill {
    background: rgba(26,26,26,0.75); border: 2px solid var(--cream); padding: 6px 10px; font-size: 13px;
    color: var(--cream); letter-spacing: 0.04em; white-space: nowrap;
  }
  #hud .pill.clock { border-color: var(--amber); color: var(--amber); }
  #hud .pill.clock.danger { border-color: var(--pink); color: var(--pink); }
  #controls {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 14px 14px calc(14px + env(safe-area-inset-bottom, 0px));
    display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none; z-index: 6;
  }
  .ctrl-group { display: flex; gap: 10px; pointer-events: auto; }
  .ctrl {
    width: 64px; height: 64px; border-radius: 50%; background: rgba(239,233,217,0.18);
    border: 3px solid rgba(239,233,217,0.6); display: flex; align-items: center; justify-content: center;
    color: var(--cream); font-family: 'Courier New', monospace; font-weight: 900; font-size: 28px;
    touch-action: none; backdrop-filter: blur(6px);
  }
  .ctrl.pressed { background: rgba(232,164,74,0.6); transform: scale(0.92); }
  .ctrl.act { width: 84px; height: 84px; font-size: 18px; background: rgba(232,164,74,0.28); border-color: var(--amber); }
  .float-text {
    position: absolute; font-family: 'Courier New', monospace; font-weight: 900; color: var(--cream);
    font-size: 18px; text-shadow: 2px 2px 0 var(--ink); pointer-events: none; animation: float 1s ease-out forwards; z-index: 4;
  }
  @keyframes float { 0%{transform:translateY(0) scale(.6);opacity:0} 15%{transform:translateY(-8px) scale(1.1);opacity:1} 100%{transform:translateY(-48px) scale(1);opacity:0} }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="400" height="700"></canvas>

  <div id="hud" class="hidden">
    <div class="pill" id="level-pill">L1 · DASH</div>
    <div class="pill" id="bones-pill">🦴 0/0</div>
    <div class="pill" id="status-pill">REACH THE GOAL →</div>
  </div>

  <div id="controls" class="hidden">
    <div class="ctrl-group">
      <div class="ctrl" id="btn-left">◀</div>
      <div class="ctrl" id="btn-right">▶</div>
    </div>
    <div class="ctrl-group">
      <div class="ctrl act" id="btn-act">JUMP</div>
    </div>
  </div>

  <!-- Level intro -->
  <div class="screen" id="intro">
    <h2 id="intro-level">VOL 11 · L1</h2>
    <h1 id="intro-title" style="font-size: clamp(20px,5.6vw,30px);">KICKOFF</h1>
    <div class="bubble" id="intro-text"></div>
    <button class="btn" id="intro-go">KICK OFF</button>
  </div>

  <!-- Level complete -->
  <div class="screen hidden" id="complete">
    <h1 id="complete-msg" style="color: var(--amber);">GOOOOAL</h1>
    <p class="bubble" id="complete-stats" style="box-shadow:6px 6px 0 var(--blue);"></p>
    <button class="btn" id="next-btn">NEXT</button>
  </div>

  <!-- Fail -->
  <div class="screen hidden" id="fail">
    <h1 id="fail-msg" style="color: var(--blue);">DENIED</h1>
    <p class="bubble" id="fail-stats" style="box-shadow:6px 6px 0 var(--amber);"></p>
    <button class="btn secondary" id="retry-btn">RUN IT BACK</button>
  </div>

  <!-- Win (Cup) -->
  <div class="screen hidden" id="win">
    <h1 style="font-size: clamp(34px,11vw,60px); color: var(--amber);">CHAMPION</h1>
    <p class="bubble" id="win-stats" style="box-shadow:6px 6px 0 var(--blue);">THE CUP IS MINE. KITTY SHOOK MY PAW. WE DO NOT SPEAK OF IT.</p>
    <button class="btn" id="win-replay">PLAY AGAIN</button>
  </div>
</div>

<script>
// =============================================================================
// BUBBA'S WORLD CUP — soccer mode prototype (standalone; integrate into index later)
// L1-L4 = DASH (run right, dodge rival squirrels, sweeping-aim kick vs Kitty keeper).
// L5 = SHOOTOUT (sudden-death penalties vs Kitty; race to 3, escalating keeper).
// Bones are optional collectibles. Stakes ramp: L1-L2 keeper-only fail, L3 mud
// pits, L4 shot clock, L5 the Final.
// =============================================================================
const PAL = {
  ink:'#1a1a1a', cream:'#efe9d9', amber:'#e8a44a', amberDeep:'#b87828',
  blue:'#6ab7e8', blueDeep:'#3a7ab0', pink:'#f0a0a8', brown:'#8a5a3a',
  brownDeep:'#5e3a22', grass:'#4a8c3a', grassDeep:'#36682b', white:'#efe9d9', gold:'#f3c44a',
  grayLight:'#b8b2a4'
};
const GAME_W = 400, GAME_H = 700;
const GROUND_Y = 560;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const GRAVITY = 0.6, MOVE = 3.4, JUMP = 13.0, MAX_FALL = 15;

// =============================================================================
// SPRITES — pixel-grid art (ported from index.html's makeSprite system).
// Bubba grids are the real game sprites (24x20). Kitty is authored here in the
// same system (24x24): seal-point Himalayan, muzzle-left as drawn.
// =============================================================================
const SPR_W = 24, SPR_H = 20, SPRITE_SCALE = 3; // -> 72x60 px

const BUBBA_IDLE_R = [
  '.................KK.....','................KKKK....','...............KKKKKK...','..............KKKKKKKK..',
  '..KKK........KKKKWKKKKK.','.KKKKK......KKKKAWKKKWK.','.KKKKKKKKKKKKKKKKWWWWWP.','KKKKKKKKKKKKKKKKKKWWWWPP',
  '.KKKKKKKKKKKKKKKKKKWWKP.','.WWWWWWWWWWWWWWWWWWKKK..','.KWWWWWWWWWWWWWWWWWK....','.KWWWWWWKKKKWWWWKKK.....',
  '..KKWWKK....KKWWKK......','..KKWK......KKWK........','..KKWK......KKWK........','..KKWK......KKWK........',
  '..KWWK......KWWK........','..KKKK......KKKK........','........................','........................'];
const BUBBA_WALK1_R = [
  '.................KK.....','................KKKK....','...............KKKKKK...','..............KKKKKKKK..',
  '..KKK........KKKKWKKKKK.','.KKKKK......KKKKAWKKKWK.','.KKKKKKKKKKKKKKKKWWWWWP.','KKKKKKKKKKKKKKKKKKWWWWPP',
  '.KKKKKKKKKKKKKKKKKKWWKP.','.WWWWWWWWWWWWWWWWWWKKK..','.KWWWWWWWWWWWWWWWWWK....','.KWWWWWKKKKWWWKKKKKK....',
  '..KKWKKK....KKWWKK......','..KKWK.......KKKK.......','.KKWWK.......KKKK.......','.KKWK.........KKK.......',
  '.KKK..........KKK.......','..K...........KK........','........................','........................'];
const BUBBA_WALK2_R = [
  '.................KK.....','................KKKK....','...............KKKKKK...','..............KKKKKKKK..',
  '..KKK........KKKKWKKKKK.','.KKKKK......KKKKAWKKKWK.','.KKKKKKKKKKKKKKKKWWWWWP.','KKKKKKKKKKKKKKKKKKWWWWPP',
  '.KKKKKKKKKKKKKKKKKKWWKP.','.WWWWWWWWWWWWWWWWWWKKK..','.KWWWWWWWWWWWWWWWWWK....','.KWWWWKKKKKWWWWWWKKK....',
  '..KKWWK....KKKWWK.......','...KKWK....KKWK.........','...KKWK....KKWK.........','...KKWK.....KKWWK.......',
  '...KKK.......KKWK.......','....K........KKK........','........................','........................'];
const BUBBA_JUMP_R = [
  '...........K.....KK.....','...........KK...KKKK....','..........KKKK.KKKKKK...','.........KKKKKKKKKKKKK..',
  '........KKKKKKKKKWKKKKK.','.......KKKKKKKKKKAWKKKWK','......KKKKKKKKKKKKWWWWWP','.....KKKKKKKKKKKKKKWWWWP',
  '.....KKKKKKKKKKKKKKKWWKP','.....WWWWWWWWWWWWWWWKKK.','....KWWWWWWWWWWWWWWWWK..','....KWWWKKKKKKWWWWKKK...',
  '.....KKWWK...KKWWKK.....','......KKK.....KKK.......','........................','........................',
  '........................','........................','........................','........................'];

function makeSprite(grid, facingRight=true, scale=SPRITE_SCALE){
  const off=document.createElement('canvas'); off.width=SPR_W*scale; off.height=SPR_H*scale;
  const c=off.getContext('2d'); c.imageSmoothingEnabled=false;
  const fwd = facingRight?PAL.amber:PAL.blue, back = facingRight?PAL.blue:PAL.amber;
  for(let y=0;y<SPR_H;y++){ const row=grid[y];
    for(let x=0;x<SPR_W;x++){ const ch=row[x]; if(ch==='.'||!ch)continue; let col;
      switch(ch){ case 'K':col=PAL.ink;break; case 'W':col=PAL.cream;break; case 'G':col=PAL.grayLight;break;
        case 'A':col=fwd;break; case 'B':col=back;break; case 'P':col=PAL.pink;break; default:col=PAL.ink; }
      c.fillStyle=col; const dx=facingRight?x:(SPR_W-1-x); c.fillRect(dx*scale,y*scale,scale,scale);
    } }
  return off;
}
const bubbaSpr = {
  idleR:makeSprite(BUBBA_IDLE_R,true), idleL:makeSprite(BUBBA_IDLE_R,false),
  walk1R:makeSprite(BUBBA_WALK1_R,true), walk1L:makeSprite(BUBBA_WALK1_R,false),
  walk2R:makeSprite(BUBBA_WALK2_R,true), walk2L:makeSprite(BUBBA_WALK2_R,false),
  jumpR:makeSprite(BUBBA_JUMP_R,true), jumpL:makeSprite(BUBBA_JUMP_R,false)
};
// Real game art: the SAME base64 sprite sheet the other Volumes use.
// Sheet = 4 poses (idle,walk1,walk2,jump) x 2 rows (row0=right, row1=left), 72x60 cells.
// Overwrites the procedural fallbacks above once it decodes.
const BUBBA_SPRITES_IMG = new Image();
BUBBA_SPRITES_IMG.onload = () => {
  const CW=SPR_W*SPRITE_SCALE, CH=SPR_H*SPRITE_SCALE;
  const poses=['idle','walk1','walk2','jump'], facings=[{s:'R',row:0},{s:'L',row:1}];
  for(const {s,row} of facings){ for(let col=0;col<poses.length;col++){
    const off=document.createElement('canvas'); off.width=CW; off.height=CH;
    const c=off.getContext('2d'); c.imageSmoothingEnabled=false;
    c.drawImage(BUBBA_SPRITES_IMG, col*CW, row*CH, CW, CH, 0,0, CW,CH);
    bubbaSpr[poses[col]+s]=off;
  } }
};

const KIT_W=24, KIT_H=24, KIT_SCALE=3; // -> 72x72 px
const KITTY = [
  '....KDK....KDK..........','...KDDDK..KDDDK.........','..KDDDDDKKDDDDDK........','..KCCCCCCCCCCCCCK.......',
  '.KCCCCCCCCCCCCCCCK......','.KMMCCCCCCCCCCCCCK......','.KMMMCCCCCCCCCCCCK......','KMMMMMCCCCCCCCCCCK......',
  'KBBMMMCCCCCCCCCCCK......','KBBMMMMCCCCCCCCCCK......','KPMMMMMCCCCCCCCCCKD.....','KPMMMMCCCCCCCCCCCKDDD...',

  'KCCCCCCCCCCCCCCCCKDD....','KCCCCCCCCCCCCCCCCKD.....','KCCCCCCCCCCCCCCCCK......','KCCCCCCCCCCCCCCCCK......',
  'KCCCCDDCCCCDDCCCCK......','.KCCDDDCCCCDDDCCK.......','..KKDDKK..KKDDKK........','...KKKK....KKKK.........'];
function makeKitty(flip=false, scale=KIT_SCALE){
  const off=document.createElement('canvas'); off.width=KIT_W*scale; off.height=KIT_H*scale;
  const c=off.getContext('2d'); c.imageSmoothingEnabled=false;
  for(let y=0;y<KIT_H;y++){ const row=(KITTY[y]||'').padEnd(KIT_W,'.').slice(0,KIT_W);
    for(let x=0;x<KIT_W;x++){ const ch=row[x]; if(ch==='.'||!ch)continue; let col;
      switch(ch){ case 'K':col=PAL.ink;break; case 'C':col=PAL.cream;break; case 'M':col=PAL.brown;break;
        case 'D':col=PAL.brownDeep;break; case 'B':col=PAL.blue;break; case 'P':col=PAL.pink;break; default:col=PAL.ink; }
      c.fillStyle=col; const dx=flip?(KIT_W-1-x):x; c.fillRect(dx*scale,y*scale,scale,scale);
    } }
  return off;
}

    bones:[ {x:360,y:B_HI}, {x:780,y:B_LO}, {x:1300,y:B_HI}, {x:1860,y:B_LO}, {x:2360,y:B_HI} ],
    hazards:[ {x1:700,x2:800}, {x1:1420,x2:1520}, {x1:1980,x2:2090} ], shotClock:null
  },
  {
    name:'STOPPAGE TIME', type:'dash', worldW:3150, keeperSave:0.32, marker:0.038,
    intro:'THE CLOCK. THE CLOCK IS RUNNING OUT. THE REF KEEPS LOOKING AT HIS WRIST. MOM IS STANDING UP. THERE IS NO TIME. THERE IS ONLY RUN. SOUP, SQUIRRELS, CLOCK — I DO NOT CARE. GET TO THE NET BEFORE THE WHISTLE. GO. GO. GO.',
    defenders:[ {x1:420,x2:600,speed:1.9}, {x1:760,x2:960,speed:2.1}, {x1:1120,x2:1300,speed:2.0}, {x1:1460,x2:1660,speed:2.2}, {x1:1820,x2:2020,speed:2.1}, {x1:2200,x2:2400,speed:2.2}, {x1:2560,x2:2740,speed:2.0} ],
    bones:[ {x:360,y:B_HI}, {x:900,y:B_LO}, {x:1380,y:B_HI}, {x:1920,y:B_LO}, {x:2480,y:B_HI} ],
    hazards:[ {x1:1040,x2:1140}, {x1:2120,x2:2220} ], shotClock:24
  },
  {
    name:'THE FINAL', type:'shootout',
    intro:'FINAL. JUST ME AND KITTY AND THE SKY. HE HASN\'T BLINKED IN SIX MINUTES. NEITHER HAVE I. FIRST TO THREE. NO RUNNING NOW — JUST THE KICK, OVER AND OVER. KITTY COVERS MORE OF THE GOAL EVERY SHOT AND THE BAR SWEEPS FASTER. WAIT FOR THE GREEN. ONE KICK. FOR ALL THE DOGS WHO EVER LIVED. MOM IS WATCHING. KICK.'
  }
];

// ---------------------------------------------------------------------------
const state = {
  mode: 'intro',     // intro, play, complete, fail, win
  phase: 'dash',     // dash | aim | kick | resolve | shoot-aim | shoot-kick | shoot-resolve
  levelIdx: 0,
  time: 0, cameraX: 0, shake: 0,
  input: { left:false, right:false, act:false, actPressed:false },
  bubba: { x:60, y:GROUND_Y-60, vx:0, vy:0, w:72, h:60, facing:1, onGround:false, run:0, stun:0 },
  ball:  { x:110, y:GROUND_Y-14, vx:0, vy:0, attached:true, _spin:0 },
  defenders: [], hazards: [], bones: [], bonesGot: new Set(),
  kitty: { x:0, y:GROUND_Y-72, w:72, h:72, save:0.16, coverC:0.5, coverH:0.2, _curY:0 },
  aim: { t:0, dir:1, speed:0.018, shotY:0 },
  clock: null, clockMax: 0,
  shoot: { goals:0, saves:0, shotNum:0 },
  particles: [],
  _kickT: 0,
};
function level(){ return LEVELS[state.levelIdx]; }
function goalX(){ return level().worldW - 230; }

// ---------------------------------------------------------------------------
function buildLevel(){
  const L = level();
  if (L.type === 'shootout'){
    state.shoot = { goals:0, saves:0, shotNum:0 };
    state.bones = []; state.bonesGot = new Set(); state.defenders = []; state.hazards = [];
    return;
  }
  state.defenders = L.defenders.map(d => ({ x:d.x1, y:GROUND_Y-44, w:40, h:44, x1:d.x1, x2:d.x2, dir:1, speed:d.speed }));
  state.hazards = (L.hazards||[]).map(h => ({...h}));
  state.bones = (L.bones||[]).map(b => ({...b}));
  state.bonesGot = new Set();
  state.kitty.save = L.keeperSave;
  state.aim.speed = L.marker;
  state.clock = L.shotClock; state.clockMax = L.shotClock;
}

function resetPlay(){
  const L = level();
  Object.assign(state.bubba, { x:60, y:GROUND_Y-60, vx:0, vy:0, facing:1, onGround:false, run:0, stun:0 });
  Object.assign(state.ball, { x:110, y:GROUND_Y-14, vx:0, vy:0, attached:true, _spin:0 });
  state.cameraX = 0; state.shake = 0; state.particles = [];
  state.aim.t = 0; state.aim.dir = 1;
  state.kitty._anim = 0;
  buildLevel();
  if (L.type === 'shootout'){ state.kitty.x = GAME_W/2 - 27; state.phase = 'shoot-aim'; setupShot(); }
  else { state.kitty.x = goalX()+150; state.phase = 'dash'; }
}

// ---------------------------------------------------------------------------
// UPDATE
// ---------------------------------------------------------------------------
function rectsOverlap(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

function update(){
  if (state.mode !== 'play') return;
  switch(state.phase){
    case 'dash': updateDash(); break;
    case 'aim': updateAim(); break;
    case 'kick': case 'resolve': updateKick(); break;
    case 'shoot-aim': updateShootAim(); break;
    case 'shoot-kick': case 'shoot-resolve': updateShootKick(); break;
  }
  updateParticles();
  if (state.shake > 0){ state.shake *= 0.86; if (state.shake < 0.3) state.shake = 0; }
}

function updateDash(){
  const b = state.bubba, gx = goalX();

  // shot clock
  if (state.clock !== null){
    state.clock -= 1/60;
    if (state.clock <= 0){ state.clock = 0; return failRun('THE WHISTLE. NO. I WAS SO CLOSE. THE REF IS A SQUIRREL TOO. I KNEW IT.'); }
  }

  if (b.stun > 0) b.stun--;
  let ax = 0;
  if (state.input.left && b.stun<=0) ax -= 1;
  if (state.input.right && b.stun<=0) ax += 1;
  if (ax !== 0) b.facing = ax;
  b.vx = ax * MOVE;
  if (state.input.actPressed && b.onGround && b.stun<=0){ b.vy = -JUMP; b.onGround = false; }
  state.input.actPressed = false;
  b.vy += GRAVITY; if (b.vy > MAX_FALL) b.vy = MAX_FALL;
  b.x += b.vx; b.y += b.vy;
  if (b.x < 0) b.x = 0;
  if (b.x + b.w > level().worldW) b.x = level().worldW - b.w;

  // ground / pits
  const overPit = state.hazards.some(h => (b.x + b.w*0.5) > h.x1 && (b.x + b.w*0.5) < h.x2);
  if (!overPit && b.y + b.h >= GROUND_Y){ b.y = GROUND_Y - b.h; b.vy = 0; b.onGround = true; }
  else b.onGround = false;
  if (overPit && b.y > GAME_H){ return failRun('THE SOUP. I AM IN THE SOUP. IT IS WONDERFUL. IT IS A DISASTER. BOTH THINGS.'); }

  if (Math.abs(b.vx) > 0.1 && b.onGround) b.run += 0.25;

  // defenders
  for (const d of state.defenders){
    d.x += d.dir * d.speed;
    if (d.x <= d.x1){ d.x = d.x1; d.dir = 1; }
    if (d.x >= d.x2){ d.x = d.x2; d.dir = -1; }
    if (b.stun<=0 && rectsOverlap(b, d)){
      const stomping = b.vy > 0 && (b.y + b.h) - d.y < 26;
      if (stomping){ b.vy = -JUMP*0.6; spawnPop(d.x+d.w/2, d.y, PAL.amber); floatText(d.x-state.cameraX, d.y, 'BOOP'); d.x = d.x1 + (d.x2-d.x1)/2; }
      else { b.stun = 26; b.vx = -6*b.facing; b.x -= 10*b.facing; state.shake = 8; spawnPop(b.x+b.w/2, b.y+b.h/2, PAL.blue); floatText(b.x-state.cameraX, b.y, 'OOF'); }
    }
  }

  // bones
  state.bones.forEach((bn,i) => {
    if (state.bonesGot.has(i)) return;
    if (Math.abs((b.x+b.w/2)-bn.x) < 26 && Math.abs((b.y+b.h/2)-bn.y) < 30){
      state.bonesGot.add(i); spawnPop(bn.x, bn.y, PAL.cream); floatText(bn.x-state.cameraX, bn.y, '🦴'); sfxBone();
      updateBonesHUD();
    }
  });

  // ball dribbles ahead
  state.ball.x = b.x + (b.facing>0 ? b.w-6 : 6);
  state.ball.y = GROUND_Y - 14 - Math.abs(Math.sin(b.run))*6;

  state.cameraX = Math.max(0, Math.min(level().worldW - GAME_W, b.x - 150));

  if (b.x + b.w >= gx - 40){
    const k = state.kitty;
    k.coverH = level().keeperSave;                        // Kitty blocks this half-width of the mouth
    k.coverC = k.coverH + Math.random()*(1 - 2*k.coverH); // ...centered somewhere it fits — read it
    k._curY = GOAL_MOUTH_TOP + k.coverC*mouthSpan();
    state.phase = 'aim'; state.aim.t = 0; state.aim.dir = 1;
    document.getElementById('status-pill').textContent = 'TAP IN THE GAP!';
  }
}

// The shot is a precision-timing check: Kitty covers a band [coverC±coverH] of the
// goal mouth; the rest is the open gap. A marker sweeps — tap while it's in the gap.
function shotIsOpen(t){ const k = state.kitty; return Math.abs(t - k.coverC) >= k.coverH; }

function updateAim(){
  const a = state.aim;
  a.t += a.dir * a.speed;
  if (a.t >= 1){ a.t = 1; a.dir = -1; }
  if (a.t <= 0){ a.t = 0; a.dir = 1; }
  const b = state.bubba; b.vx = 0; b.onGround = true; b.y = GROUND_Y - b.h;
  state.cameraX = Math.max(0, Math.min(level().worldW - GAME_W, goalX() - 110));
  state.ball.x = b.x + b.w - 6; state.ball.y = GROUND_Y - 14;

  if (state.input.actPressed){
    state.input.actPressed = false;
    a.shotY = GOAL_MOUTH_TOP + a.t * mouthSpan();
    state._shotSaved = !shotIsOpen(a.t);   // tapped over Kitty's band = saved
    launchBall(goalX()+120, a.shotY);
    state.phase = 'kick'; state._kickT = 0; state.shake = 6; sfxKick();
    document.getElementById('status-pill').textContent = '...';
  }
}

function launchBall(tx, ty){
  const ball = state.ball; ball.attached = false;
  const steps = 22; ball.vx = (tx-ball.x)/steps; ball.vy = (ty-ball.y)/steps;
}

function updateKick(){
  const ball = state.ball;
  state._kickT++;
  ball.x += ball.vx; ball.y += ball.vy; ball._spin += 0.4;
  if (state.phase === 'kick' && ball.x >= goalX() + 110){
    state.phase = 'resolve';
    const saved = state._shotSaved;
    if (!saved){ spawnPop(goalX()+140, state.aim.shotY, PAL.amber); state.shake = 14; }
    else { spawnPop(goalX()+120, state.kitty._curY, PAL.blue); state.shake = 10; }
    setTimeout(() => saved ? failRun('KITTY. KITTY GOT A PAW ON IT. UNBELIEVABLE. I DEMAND A REPLAY. I DEMAND A SNACK.') : completeLevel(), 550);
  }
}

// ---- shootout (L5) ----
function setupShot(){
  const s = state.shoot, k = state.kitty;
  state.aim.t = 0; state.aim.dir = 1;
  state.aim.speed = 0.026 + s.shotNum*0.006;             // sweep speeds up each shot
  k.coverH = Math.min(0.42, 0.20 + s.shotNum*0.03);      // Kitty covers MORE each shot
  k.coverC = k.coverH + Math.random()*(1 - 2*k.coverH);  // ...from a fresh spot you must re-read
  k._curY = GOAL_MOUTH_TOP + k.coverC*mouthSpan();
  // penalty geometry (no camera): ball at the spot BELOW the mouth, bubba behind it
  Object.assign(state.ball, { x:GAME_W/2-9, y:GROUND_Y-8, vx:0, vy:0, attached:true, _spin:0 });
  Object.assign(state.bubba, { x:GAME_W/2-70, y:GROUND_Y-60, facing:1, vx:0, onGround:true });
  state.phase = 'shoot-aim';
  document.getElementById('status-pill').textContent = `BUBBA ${s.goals} · KITTY ${s.saves}`;
}

function updateShootAim(){
  const a = state.aim;
  a.t += a.dir * a.speed;
  if (a.t >= 1){ a.t = 1; a.dir = -1; }
  if (a.t <= 0){ a.t = 0; a.dir = 1; }
  if (state.input.actPressed){
    state.input.actPressed = false;
    a.shotY = GOAL_MOUTH_TOP + a.t * mouthSpan();
    state._shotSaved = !shotIsOpen(a.t);
    launchBall(GAME_W/2, a.shotY);
    state.phase = 'shoot-kick'; state._kickT = 0; state.shake = 6; sfxKick();
    document.getElementById('status-pill').textContent = '...';
  }
}

function updateShootKick(){
  const ball = state.ball, s = state.shoot;
  state._kickT++;
  ball.x += ball.vx; ball.y += ball.vy; ball._spin += 0.4;
  if (state.phase === 'shoot-kick' && state._kickT >= 20){
    state.phase = 'shoot-resolve';
    const saved = state._shotSaved;
    if (saved){ s.saves++; spawnPop(GAME_W/2, state.kitty._curY, PAL.blue); state.shake = 12; sfxFail(); }
    else { s.goals++; spawnPop(ball.x, ball.y, PAL.amber); state.shake = 15; sfxGoal(); }
    s.shotNum++;
    setTimeout(() => {
      if (s.goals >= 3) return winCup();
      if (s.saves >= 3) return failRun('THREE. KITTY SAVED THREE. KITTY IS IN GOAL AND KITTY IS GOOD AND I HAVE NEVER BEEN SO BETRAYED BY PHYSICS.');
      setupShot();
    }, 850);
  }
}

// ---------------------------------------------------------------------------
function spawnPop(x,y,color){ for(let i=0;i<14;i++){ const a=Math.random()*Math.PI*2,s=Math.random()*4+1; state.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:1,color}); } }
function updateParticles(){ for(const p of state.particles){ p.x+=p.vx; p.y+=p.vy; p.vy+=0.3; p.life-=0.03; } state.particles = state.particles.filter(p=>p.life>0); }
function floatText(sx, sy, text){
  const el = document.createElement('div'); el.className='float-text'; el.textContent=text;
  const rect = canvas.getBoundingClientRect(); const scaleX=rect.width/GAME_W, scaleY=rect.height/GAME_H;
  el.style.left=(sx*scaleX)+'px'; el.style.top=(sy*scaleY)+'px';
  document.getElementById('stage').appendChild(el); setTimeout(()=>el.remove(),1000);
}

// SFX
let actx;
function getAudio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function tone(freq,dur,type='square',vol=0.12,sweep=0){ const a=getAudio(); if(!a)return; const o=a.createOscillator(),g=a.createGain(); o.type=type; o.frequency.setValueAtTime(freq,a.currentTime); if(sweep)o.frequency.linearRampToValueAtTime(freq+sweep,a.currentTime+dur); g.gain.setValueAtTime(vol,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+dur); o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur); }
function sfxKick(){ tone(160,0.09,'square',0.18,-60); }
function sfxGoal(){ tone(523,0.1,'square',0.14); setTimeout(()=>tone(659,0.1),90); setTimeout(()=>tone(784,0.18),180); }
function sfxFail(){ tone(200,0.18,'sawtooth',0.14,-90); }
function sfxBone(){ tone(880,0.06,'square',0.1); setTimeout(()=>tone(1180,0.06),60); }

// ---------------------------------------------------------------------------
// RENDER
// ---------------------------------------------------------------------------
function render(){
  ctx.imageSmoothingEnabled = false;
  let sx=0, sy=0; if(state.shake>0){ sx=(Math.random()-0.5)*state.shake; sy=(Math.random()-0.5)*state.shake; }
  ctx.save(); ctx.translate(sx,sy);
  drawSky();
  if (state.mode==='play' || state.mode==='complete' || state.mode==='fail' || state.mode==='win'){
    if (level().type === 'shootout') drawShootout(); else drawField();
  }
  for(const p of state.particles){ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.color; ctx.fillRect((level().type==='shootout'?p.x:p.x-state.cameraX)-2,p.y-2,4,4); }
  ctx.globalAlpha=1;
  ctx.restore();
}

function drawSky(){ const g=ctx.createLinearGradient(0,0,0,GROUND_Y); g.addColorStop(0,'#3a7ab0'); g.addColorStop(1,'#9fd0ec'); ctx.fillStyle=g; ctx.fillRect(0,0,GAME_W,GROUND_Y); ctx.fillStyle='rgba(255,240,200,0.9)'; ctx.fillRect(40,40,46,46); }

// Distant bleachers as a thin LIGHT band, high up and clear of Bubba's run zone,
// so the black sprite stays readable against open sky below it.
function drawStands(cam, worldW){
  const top = GROUND_Y-150, h = 44;
  ctx.fillStyle='#c7d2dc'; ctx.fillRect(0, top, GAME_W, h);
  ctx.fillStyle='#aeb9c4'; ctx.fillRect(0, top+h-6, GAME_W, 6);
  for(let i=0;i<90;i++){ const wx=(i*97)%(worldW||GAME_W); const sxp=wx-cam*0.4; const xx=((sxp%GAME_W)+GAME_W)%GAME_W; ctx.fillStyle=['#e8a44a','#6ab7e8','#f0a0a8','#b87828'][i%4]; ctx.fillRect(xx, top+6+(i*23)%30, 5,5); }
}

function drawPitchStripes(cam, worldW){
  ctx.fillStyle=PAL.grass; ctx.fillRect(0,GROUND_Y,GAME_W,GAME_H-GROUND_Y);
  for(let wx=0; wx<worldW; wx+=120){ const sxp=wx-cam; if(sxp>-120&&sxp<GAME_W){ ctx.fillStyle=(Math.floor(wx/120)%2===0)?PAL.grassDeep:PAL.grass; ctx.fillRect(sxp,GROUND_Y,120,GAME_H-GROUND_Y);} }
}

function drawField(){
  const cam = state.cameraX, L = level();
  drawStands(cam, L.worldW);
  drawPitchStripes(cam, L.worldW);
  // yard lines
  ctx.fillStyle='rgba(239,233,217,0.5)';
  for(let wx=200; wx<L.worldW; wx+=300){ const sxp=wx-cam; if(sxp>-4&&sxp<GAME_W) ctx.fillRect(sxp,GROUND_Y,4,GAME_H-GROUND_Y); }
  // mud pits
  for(const h of state.hazards){ const hx=h.x1-cam, hw=h.x2-h.x1; if(hx<GAME_W&&hx+hw>0){ ctx.fillStyle=PAL.brownDeep; ctx.fillRect(hx,GROUND_Y,hw,GAME_H-GROUND_Y); ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(hx,GROUND_Y,hw,10); } }
  // goal
  drawGoal(goalX()-cam, GOAL_MOUTH_TOP, GOAL_MOUTH_BOT);
  // bones
  state.bones.forEach((bn,i)=>{ if(state.bonesGot.has(i))return; const bx=bn.x-cam; if(bx>-20&&bx<GAME_W+20) drawBone(bx,bn.y+Math.sin(state.time*0.005+i)*3); });
  // defenders
  for(const d of state.defenders){ const dsx=d.x-cam; if(dsx>-60&&dsx<GAME_W+60) drawSquirrel(dsx, d.y, d.dir); }
  // kitty keeper (faces left toward the incoming ball); leaps only on a real save
  const inShot = (state.phase==='aim'||state.phase==='kick'||state.phase==='resolve');
  const diving = (state.phase==='kick'||state.phase==='resolve') && state._shotSaved;
  const ky = inShot ? Math.min(state.kitty._curY, GROUND_Y-state.kitty.h) : state.kitty.y;
  drawKitty(state.kitty.x-cam, ky, diving?'dive':'idle', true);
  // ball
  drawBall(state.ball.x-cam, state.ball.y);
  // bubba
  drawBubba(state.bubba.x-cam, state.bubba.y, state.bubba.facing, state.bubba.run, state.bubba.stun>0);
  // aim marker
  if (state.phase==='aim') drawAimMarker(goalX()-cam);
}

function drawShootout(){
  drawStands(0, GAME_W);
  drawPitchStripes(0, GAME_W);
  // centered goal
  const gx = GAME_W/2 - 89;
  drawGoal(gx, GOAL_MOUTH_TOP, GOAL_MOUTH_BOT);
  // penalty spot
  ctx.fillStyle='rgba(239,233,217,0.7)'; ctx.fillRect(GAME_W/2-3, GROUND_Y-8, 6,6);
  // kitty keeper centered in mouth
  const diving = (state.phase==='shoot-kick'||state.phase==='shoot-resolve') && state._shotSaved;
  const ky = Math.min(state.kitty._curY, GOAL_MOUTH_BOT-state.kitty.h);
  drawKitty(GAME_W/2-36, ky, diving?'dive':'idle', false);
  drawBall(state.ball.x, state.ball.y);
  drawBubba(state.bubba.x, state.bubba.y, 1, 0, false);
  if (state.phase==='shoot-aim') drawAimMarker(gx);
  // scoreboard
  ctx.font='900 18px Courier New'; ctx.textAlign='center'; ctx.fillStyle=PAL.ink;
  ctx.fillRect(GAME_W/2-92,18,184,34); ctx.fillStyle=PAL.cream;
  ctx.fillText(`BUBBA ${state.shoot.goals}  -  ${state.shoot.saves} KITTY`, GAME_W/2, 41);
  ctx.textAlign='left';
}

function drawGoal(gx, top, bot){
  ctx.fillStyle=PAL.cream;
  ctx.fillRect(gx, top, 8, bot-top); ctx.fillRect(gx+170, top, 8, bot-top); ctx.fillRect(gx, top, 178, 8);
  ctx.strokeStyle='rgba(239,233,217,0.35)'; ctx.lineWidth=1;
  for(let y=top; y<bot; y+=14){ ctx.beginPath(); ctx.moveTo(gx+8,y); ctx.lineTo(gx+170,y); ctx.stroke(); }
  for(let x=gx+8; x<gx+170; x+=16){ ctx.beginPath(); ctx.moveTo(x,top+8); ctx.lineTo(x,bot); ctx.stroke(); }
}

function drawAimMarker(gx){
  const k = state.kitty, top = GOAL_MOUTH_TOP, span = mouthSpan();
  // Kitty's blocked band — the slice of goal he's covering (red wash)
  const bTop = Math.max(top, top + (k.coverC - k.coverH)*span);
  const bBot = Math.min(top+span, top + (k.coverC + k.coverH)*span);
  ctx.globalAlpha = 0.28; ctx.fillStyle = '#e8554a'; ctx.fillRect(gx+8, bTop, 162, bBot-bTop); ctx.globalAlpha = 1;
  // sweeping marker — GREEN in the open gap, RED over Kitty. Tap on green.
  const t = state.aim.t, y = top + t*span, open = shotIsOpen(t);
  ctx.fillStyle = open ? '#46c24a' : '#e8554a';
  ctx.globalAlpha = 0.95; ctx.fillRect(gx, y-7, 178, 14); ctx.globalAlpha = 1;
  ctx.fillStyle = PAL.ink; ctx.fillRect(gx+82, y-4, 14, 8);
}

// ---- sprites ----
function px(x,y,w,h,color){ ctx.fillStyle=color; ctx.fillRect(Math.round(x),Math.round(y),w,h); }
function drawBone(x,y){ px(x-9,y-3,18,6,PAL.cream); px(x-11,y-6,6,12,PAL.cream); px(x+5,y-6,6,12,PAL.cream); }

function drawBubba(x,y,facing,run,stunned){
  if (stunned && Math.floor(state.time/80)%2===0) return; // blink on hit
  const b = state.bubba;
  let pose;
  if (!b.onGround) pose='jump';
  else if (Math.abs(b.vx) > 0.1) pose = (Math.floor(run/(Math.PI/2))%2===0) ? 'walk1' : 'walk2';
  else pose='idle';
  ctx.drawImage(bubbaSpr[pose + (facing<0?'L':'R')], Math.round(x), Math.round(y));
}

const KEEPER_H = 118; // on-screen keeper height; bottom-aligned to the legacy 72px box
function drawKitty(x,y,pose,flip){
  const img = (pose==='dive') ? kittyDiveImg : kittyIdleImg;
  const cx = x + 36; // center of the legacy keeper box
  if (!img.complete || !img.naturalWidth){ ctx.drawImage(kittyL, Math.round(x), Math.round(y)); return; }
  const h = KEEPER_H, w = img.naturalWidth * (h/img.naturalHeight);
  const dx = Math.round(cx - w/2), dy = Math.round(y - (h-72)); // align feet to old box bottom
  ctx.save();
  ctx.imageSmoothingEnabled = true;
  if (flip){ ctx.translate(dx + w, 0); ctx.scale(-1,1); ctx.drawImage(img, 0, dy, w, h); }
  else ctx.drawImage(img, dx, dy, w, h);
  ctx.restore();
  ctx.imageSmoothingEnabled = false;
}

function drawSquirrel(x,y,dir){
  ctx.save(); if(dir<0){ ctx.translate(x+40,0); ctx.scale(-1,1); x=0; }
  const g=PAL.brown, cream=PAL.cream;
  px(x+18,y+2,16,30,g); px(x+4,y+14,22,22,g); px(x+2,y+8,14,14,g);
  px(x+0,y+12,5,5,PAL.ink); px(x+10,y+22,8,10,cream); px(x+6,y+18,18,4,PAL.blue);
  ctx.restore();
}

function drawBall(x,y){ px(x-9,y-9,18,18,PAL.cream); px(x-3,y-3,6,6,PAL.ink); px(x-8,y-1,3,3,PAL.ink); px(x+5,y-1,3,3,PAL.ink); px(x-1,y+4,3,3,PAL.ink); }

// ---------------------------------------------------------------------------
// FLOW
// ---------------------------------------------------------------------------
function showScreen(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden')); const el=document.getElementById(id); if(el)el.classList.remove('hidden'); }
function hudOn(on){ document.getElementById('hud').classList.toggle('hidden',!on); document.getElementById('controls').classList.toggle('hidden',!on); }

function startLevel(idx){
  state.levelIdx = idx; const L = LEVELS[idx];
  document.getElementById('intro-level').textContent = `VOL 11 · L${idx+1}/5`;
  document.getElementById('intro-title').textContent = L.name;
  document.getElementById('intro-text').textContent = L.intro;
  document.getElementById('intro-go').textContent = L.type==='shootout' ? 'STEP UP' : 'KICK OFF';
  showScreen('intro'); state.mode='intro'; hudOn(false);
}
function beginPlay(){
  showScreen(null); document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));
  resetPlay(); state.mode='play'; hudOn(true);
  const L = level();
  document.getElementById('level-pill').textContent = `L${state.levelIdx+1} · ${L.type==='shootout'?'SHOOTOUT':'DASH'}`;
  document.getElementById('bones-pill').style.display = L.type==='shootout' ? 'none' : '';
  document.getElementById('status-pill').textContent = L.type==='shootout' ? 'FIRST TO 3' : 'REACH THE GOAL →';
  updateBonesHUD();
}
function updateBonesHUD(){ const L=level(); if(L.type==='shootout')return; document.getElementById('bones-pill').textContent = `🦴 ${state.bonesGot.size}/${state.bones.length}`; }

function completeLevel(){
  state.mode='complete'; hudOn(false);
  const got = state.bonesGot.size, tot = state.bones.length;
  const msgs = ['GOOOOAL','TOP CORNER','HE NEVER SAW IT','UNSTOPPABLE'];
  document.getElementById('complete-msg').textContent = msgs[state.levelIdx % msgs.length];
  document.getElementById('complete-stats').textContent = `BONES: ${got}/${tot}. kitty is FURIOUS. on to the next.`;
  document.getElementById('next-btn').textContent = state.levelIdx >= LEVELS.length-2 ? 'THE FINAL →' : 'NEXT LEVEL';
  showScreen('complete');
}
function failRun(msg){
  state.mode='fail'; hudOn(false);
  document.getElementById('fail-stats').textContent = msg || 'kitty. KITTY. unbelievable.';
  showScreen('fail');
}
function winCup(){
  state.mode='win'; hudOn(false);
  spawnPop(GAME_W/2, 300, PAL.gold); state.shake=18;
  showScreen('win');
}

// INPUT
function bindBtn(el,key){
  const down=e=>{ e.preventDefault(); state.input[key]=true; if(key==='act')state.input.actPressed=true; el.classList.add('pressed'); getAudio(); };
  const up=e=>{ e.preventDefault(); state.input[key]=false; el.classList.remove('pressed'); };
  el.addEventListener('touchstart',down,{passive:false}); el.addEventListener('touchend',up,{passive:false}); el.addEventListener('touchcancel',up,{passive:false});
  el.addEventListener('mousedown',down); el.addEventListener('mouseup',up); el.addEventListener('mouseleave',up);
}
bindBtn(document.getElementById('btn-left'),'left');
bindBtn(document.getElementById('btn-right'),'right');
bindBtn(document.getElementById('btn-act'),'act');
window.addEventListener('keydown',e=>{
  if(e.key==='a'||e.key==='ArrowLeft')state.input.left=true;
  if(e.key==='d'||e.key==='ArrowRight')state.input.right=true;
  if(e.key===' '||e.key==='ArrowUp'||e.key==='w'){ if(!state.input.act)state.input.actPressed=true; state.input.act=true; e.preventDefault(); }
});
window.addEventListener('keyup',e=>{
  if(e.key==='a'||e.key==='ArrowLeft')state.input.left=false;
  if(e.key==='d'||e.key==='ArrowRight')state.input.right=false;
  if(e.key===' '||e.key==='ArrowUp'||e.key==='w')state.input.act=false;
});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

document.getElementById('intro-go').addEventListener('click',()=>{ getAudio(); beginPlay(); });
document.getElementById('next-btn').addEventListener('click',()=>startLevel(state.levelIdx+1));
document.getElementById('retry-btn').addEventListener('click',()=>beginPlay());
document.getElementById('win-replay').addEventListener('click',()=>startLevel(0));

// HUD clock paint (in render loop side-channel)
function paintClock(){
  const pill=document.getElementById('status-pill');
  if(state.mode==='play' && state.phase==='dash' && state.clock!==null){
    pill.classList.add('clock'); pill.classList.toggle('danger', state.clock<5);
    pill.textContent = `⏱ ${state.clock.toFixed(1)}`;
  } else { pill.classList.remove('clock','danger'); }
}

// RESIZE + LOOP
function resize(){
  const stage=document.getElementById('stage'); const vw=window.innerWidth, vh=window.innerHeight;
  const target=GAME_W/GAME_H, vr=vw/vh; let w,h;
  if(vr>target){ h=vh; w=vh*target; } else { w=vw; h=vw/target; }
  stage.style.width=w+'px'; stage.style.height=h+'px';
}
window.addEventListener('resize',resize); window.addEventListener('orientationchange',()=>setTimeout(resize,100)); resize();

let last=0;
function loop(t){ state.time=t; update(); paintClock(); render(); requestAnimationFrame(loop); }
startLevel(0);
requestAnimationFrame(loop);
</script>
